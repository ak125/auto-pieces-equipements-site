# Mises à jour des actions GitHub épinglées par SHA.
# Les correctifs de sécurité npm passent par les alertes Dependabot du dépôt.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
