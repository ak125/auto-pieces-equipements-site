name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Validate and build the public allowlist
        run: npm test

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  verify:
    name: Verify published files
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download the deployed artifact from this run
        uses: actions/download-artifact@v8.0.1
        with:
          name: github-pages
          path: tmp/pages-artifact

      - name: Extract the deployed public files
        run: |
          mkdir -p tmp/pages-artifact/public
          tar -xf tmp/pages-artifact/artifact.tar -C tmp/pages-artifact/public

      - name: Verify public content and private paths
        run: node scripts/verify-publication.mjs tmp/pages-artifact/public

      - name: Record verification result
        if: always()
        run: |
          if [ -f tmp/evidence/publication-verification.json ]; then
            cat tmp/evidence/publication-verification.json
          fi
          echo "Publication verification: $VERIFY_OUTCOME. See the verification step and JSON log for file details." >> "$GITHUB_STEP_SUMMARY"
        env:
          VERIFY_OUTCOME: ${{ job.status }}
